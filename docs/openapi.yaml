openapi: 3.1.0
info:
  title: Collab Task System API
  version: 0.1.0
  description: |
    Event-sourced collaborative task management API.

    The write path accepts append commands. The read path serves the current
    projection snapshot, incremental event slices, paged task windows, and an
    SSE stream for committed events and presence updates.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /
    description: Relative application root
security: []
paths:
  /api/projects:
    post:
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{projectId}/snapshot:
    get:
      summary: Fetch the current project snapshot
      operationId: getProjectSnapshot
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Current project snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSnapshotResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{projectId}/events:
    get:
      summary: Fetch committed events after a given version
      operationId: getProjectEvents
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: since
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Ordered committed events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Append a project event
      operationId: appendProjectEvent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendProjectEventRequest"
      responses:
        "201":
          description: Event committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendProjectEventResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{projectId}/notifications:
    get:
      summary: Fetch durable mention notifications for a project user
      operationId: getProjectNotifications
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mention notifications ordered by recency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectNotificationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{projectId}/presence:
    post:
      summary: Update ephemeral presence and live cursor state
      operationId: updateProjectPresence
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceUpdateRequest"
      responses:
        "200":
          description: Updated project viewer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{projectId}/tasks:
    get:
      summary: Fetch a cursor-paged task window
      operationId: getProjectTaskPage
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: Base64url-encoded cursor for the last visible task
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Task page with scoped comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectTaskPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{projectId}/tasks/{taskId}/description:
    get:
      summary: Fetch the current collaborative description state for a task
      operationId: getTaskDescriptionState
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Base64url-encoded Yjs state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDescriptionStateResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Apply a collaborative description update for a task
      operationId: syncTaskDescriptionUpdate
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDescriptionSyncRequest"
      responses:
        "200":
          description: Update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDescriptionSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{projectId}/tasks/{taskId}/description/stream:
    get:
      summary: Subscribe to collaborative task-description updates over SSE
      operationId: streamTaskDescriptionUpdates
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
        - name: clientId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: |
            Server-sent event stream for task description updates.

            Events emitted:
            - `description-update`
            - `heartbeat`
          content:
            text/event-stream:
              schema:
                type: string
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/projects/{projectId}/stream:
    get:
      summary: Subscribe to committed events and presence over SSE
      operationId: streamProjectEvents
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: clientId
          in: query
          required: false
          schema:
            type: string
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: location
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: |
            Server-sent event stream.

            Events emitted:
            - `version`
            - `project-event`
            - `presence`
            - `heartbeat`
          content:
            text/event-stream:
              schema:
                type: string
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Request parsing or query validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: Expected version did not match current project version
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnprocessableEntity:
      description: Domain validation rejected the command
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    InternalError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

  schemas:
    TaskStatus:
      type: string
      enum: [todo, in_progress, done, blocked, canceled]

    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    TaskConfig:
      type: object
      properties:
        priority:
          $ref: "#/components/schemas/TaskPriority"
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        customFields:
          type: object
          additionalProperties: true
      additionalProperties: false

    Project:
      type: object
      required: [id, name, metadata, currentVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        metadata:
          type: object
          additionalProperties: true
        currentVersion:
          type: integer
          minimum: 0
        createdAt:
          type: integer
          minimum: 0
        updatedAt:
          type: integer
          minimum: 0

    Task:
      type: object
      required:
        - id
        - projectId
        - title
        - status
        - assignedTo
        - configuration
        - dependencies
        - position
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        assignedTo:
          type: array
          items:
            type: string
        configuration:
          $ref: "#/components/schemas/TaskConfig"
        dependencies:
          type: array
          items:
            type: string
        position:
          type: number
        createdAt:
          type: integer
          minimum: 0
        updatedAt:
          type: integer
          minimum: 0

    Comment:
      type: object
      required: [id, taskId, content, author, mentions, createdAt, updatedAt]
      properties:
        id:
          type: string
        taskId:
          type: string
        content:
          type: string
        author:
          type: string
        mentions:
          type: array
          items:
            type: string
        createdAt:
          type: integer
          minimum: 0
        updatedAt:
          type: integer
          minimum: 0

    PresenceCursor:
      type: object
      required: [kind, taskId, taskTitle, label]
      properties:
        kind:
          type: string
          enum: [task, comment, description, board]
        taskId:
          type: string
        taskTitle:
          type: string
        label:
          type: string

    PresenceViewer:
      type: object
      required: [clientId, userId, location, connectedAt]
      properties:
        clientId:
          type: string
        userId:
          type: string
        location:
          type: string
        connectedAt:
          type: integer
          minimum: 0
        cursor:
          $ref: "#/components/schemas/PresenceCursor"

    MentionNotification:
      type: object
      required:
        - id
        - projectId
        - taskId
        - taskTitle
        - commentId
        - userId
        - actorUserId
        - contentPreview
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        projectId:
          type: string
        taskId:
          type: string
        taskTitle:
          type: string
        commentId:
          type: string
        userId:
          type: string
        actorUserId:
          type: string
        contentPreview:
          type: string
        createdAt:
          type: integer
          minimum: 0
        updatedAt:
          type: integer
          minimum: 0

    ProjectCreateAction:
      type: object
      required: [type, data]
      properties:
        type:
          const: project.create
        data:
          type: object
          required: [name]
          properties:
            name:
              type: string
            description:
              type: string
            metadata:
              type: object
              additionalProperties: true

    ProjectUpdateAction:
      type: object
      required: [type, data]
      properties:
        type:
          const: project.update
        data:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            metadata:
              type: object
              additionalProperties: true
          minProperties: 1

    TaskCreateAction:
      type: object
      required: [type, data]
      properties:
        type:
          const: task.create
        data:
          type: object
          required: [title, status, projectId]
          properties:
            title:
              type: string
            status:
              $ref: "#/components/schemas/TaskStatus"
            projectId:
              type: string
            assignedTo:
              type: array
              items:
                type: string
            configuration:
              $ref: "#/components/schemas/TaskConfig"
            dependencies:
              type: array
              items:
                type: string
            position:
              type: number

    TaskUpdateAction:
      type: object
      required: [type, data]
      properties:
        type:
          const: task.update
        data:
          type: object
          properties:
            title:
              type: string
            status:
              $ref: "#/components/schemas/TaskStatus"
            assignedTo:
              type: array
              items:
                type: string
            configuration:
              $ref: "#/components/schemas/TaskConfig"
            dependencies:
              type: array
              items:
                type: string
            position:
              type: number
          minProperties: 1

    EmptyActionData:
      type: object
      additionalProperties: false

    TaskDeleteAction:
      type: object
      required: [type, data]
      properties:
        type:
          const: task.delete
        data:
          $ref: "#/components/schemas/EmptyActionData"

    CommentCreateAction:
      type: object
      required: [type, data]
      properties:
        type:
          const: comment.create
        data:
          type: object
          required: [taskId, content, author]
          properties:
            taskId:
              type: string
            content:
              type: string
            author:
              type: string

    CommentUpdateAction:
      type: object
      required: [type, data]
      properties:
        type:
          const: comment.update
        data:
          type: object
          required: [content]
          properties:
            content:
              type: string

    CommentDeleteAction:
      type: object
      required: [type, data]
      properties:
        type:
          const: comment.delete
        data:
          $ref: "#/components/schemas/EmptyActionData"

    PresenceUpdateAction:
      type: object
      required: [type, data]
      properties:
        type:
          const: presence.update
        data:
          type: object
          required: [userId, location]
          properties:
            userId:
              type: string
            location:
              type: string
            cursor:
              $ref: "#/components/schemas/PresenceCursor"

    EventAction:
      oneOf:
        - $ref: "#/components/schemas/ProjectCreateAction"
        - $ref: "#/components/schemas/ProjectUpdateAction"
        - $ref: "#/components/schemas/TaskCreateAction"
        - $ref: "#/components/schemas/TaskUpdateAction"
        - $ref: "#/components/schemas/TaskDeleteAction"
        - $ref: "#/components/schemas/CommentCreateAction"
        - $ref: "#/components/schemas/CommentUpdateAction"
        - $ref: "#/components/schemas/CommentDeleteAction"
        - $ref: "#/components/schemas/PresenceUpdateAction"

    ProjectEvent:
      type: object
      required:
        - id
        - projectId
        - entityId
        - action
        - version
        - clientId
        - userId
        - timestamp
      properties:
        id:
          type: string
        projectId:
          type: string
        entityId:
          type: string
        action:
          $ref: "#/components/schemas/EventAction"
        version:
          type: integer
          minimum: 1
        clientId:
          type: string
        userId:
          type: string
        timestamp:
          type: integer
          minimum: 0
        parentVersion:
          type: integer
          minimum: 0

    AppendProjectEventRequest:
      type: object
      required:
        - id
        - entityId
        - action
        - clientId
        - userId
        - timestamp
        - expectedVersion
      properties:
        id:
          type: string
        entityId:
          type: string
        action:
          $ref: "#/components/schemas/EventAction"
        clientId:
          type: string
        userId:
          type: string
        timestamp:
          type: integer
          minimum: 0
        expectedVersion:
          type: integer
          minimum: 0
        parentVersion:
          type: integer
          minimum: 0

    AppendProjectEventResponse:
      type: object
      required: [event]
      properties:
        event:
          $ref: "#/components/schemas/ProjectEvent"

    CreateProjectRequest:
      type: object
      required: [name, clientId, userId]
      properties:
        name:
          type: string
        description:
          type: string
        metadata:
          type: object
          additionalProperties: true
        clientId:
          type: string
        userId:
          type: string

    CreateProjectResponse:
      type: object
      required: [projectId, event]
      properties:
        projectId:
          type: string
        event:
          $ref: "#/components/schemas/ProjectEvent"

    ProjectSnapshot:
      type: object
      required: [project, tasks, comments, version]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        version:
          type: integer
          minimum: 0

    ProjectSnapshotResponse:
      type: object
      required: [snapshot]
      properties:
        snapshot:
          $ref: "#/components/schemas/ProjectSnapshot"

    ProjectEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ProjectEvent"

    ProjectTaskPage:
      type: object
      required: [tasks, comments, nextCursor, hasMore, totalCount]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        nextCursor:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
        totalCount:
          type: integer
          minimum: 0

    ProjectTaskPageResponse:
      type: object
      required: [page]
      properties:
        page:
          $ref: "#/components/schemas/ProjectTaskPage"

    ProjectNotificationsResponse:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/MentionNotification"

    PresenceUpdateRequest:
      type: object
      required: [clientId, userId, location]
      properties:
        clientId:
          type: string
        userId:
          type: string
        location:
          type: string
        cursor:
          oneOf:
            - $ref: "#/components/schemas/PresenceCursor"
            - type: "null"

    PresenceUpdateResponse:
      type: object
      required: [viewers]
      properties:
        viewers:
          type: array
          items:
            $ref: "#/components/schemas/PresenceViewer"

    TaskDescriptionStateResponse:
      type: object
      required: [state]
      properties:
        state:
          type: string

    TaskDescriptionSyncRequest:
      type: object
      required: [clientId, update]
      properties:
        clientId:
          type: string
        update:
          type: string

    TaskDescriptionSyncResponse:
      type: object
      required: [ok]
      properties:
        ok:
          const: true

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ApiErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
