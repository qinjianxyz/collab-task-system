services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: collab_task_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab_task_system"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/collab_task_system
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres-data:
